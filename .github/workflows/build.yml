name: Build Azur Promilia

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test public download and release tooling
        shell: pwsh
        run: |
          dotnet run --project tests/PublicDownloadTests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Public download tests failed.' }
          ./.github/scripts/Test-PluginRelease.ps1
      - name: Publish Native AOT
        shell: pwsh
        run: |
          dotnet publish Hi3Helper.Plugin.Azurpromilia -c DebugNoReflection -r win-x64 -p:PublishProfile=DebugNoReflectionPublish -o publish_output
          if ($LASTEXITCODE -ne 0) { throw 'Plugin publish failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: AzurPromilia-DebugNoReflectionPublish
          path: publish_output/
          if-no-files-found: error
